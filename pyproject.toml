# =============================================================================
# Puls-Events — Assistant RAG de recommandation d'événements culturels
# =============================================================================

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DS_OC_Projet9"
version = "0.1.0"
description = "Projet 9 - Data Scientist OpenClassrooms"
authors = [{ name = "Lavin", email = "vincentgirardin10120@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pyarrow>=14.0.0",
    "python-dateutil>=2.8.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=21.2.0",
    "beautifulsoup4>=4.12.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.4,<0.4.2",
    "langchain-mistralai>=0.1.0",
    "ollama>=0.1.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "datasets",
    "ragas",
]

[project.scripts]
fetch_events = "scripts.fetch_events:main"
clean_events = "scripts.clean_events:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "config*"]

[tool.black]
line-length = 88
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
