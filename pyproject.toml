# =============================================================================
# Puls-Events — Assistant RAG de recommandation d'événements culturels
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "puls-events-rag"
version = "0.1.0"
description = "POC d'un chatbot RAG (LangChain + Mistral + FAISS) sur les événements culturels Open Agenda"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Ton Nom", email = "ton.email@example.com" }]
license = { text = "MIT" }

# --- Dépendances principales (nécessaires pour faire tourner le RAG et l'API)
dependencies = [
    # Orchestration RAG
    "langchain>=1.0,<2.0",
    "langchain-community>=0.4,<1.0",
    "langchain-mistralai>=1.0,<2.0",
    "langchain-text-splitters>=1.0,<2.0",

    # LLM et embeddings Mistral (SDK officiel)
    "mistralai>=1.9,<2.0",

    # Base vectorielle (version CPU, plus portable)
    "faiss-cpu>=1.9,<2.0",
    "numpy>=1.26,<3.0",

    # API REST
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",

    # Collecte et préparation des données
    "requests>=2.32,<3.0",
    "pandas>=2.2,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# Embeddings locaux HuggingFace : installe PyTorch, ce qui est lourd (1 à 2 Go).
# Ces paquets sont séparés pour garder l'image Docker légère si on utilise
# uniquement mistral-embed.
local-embeddings = [
    "langchain-huggingface>=1.0,<2.0",
    "sentence-transformers>=3.0,<6.0",
]

# Outils de développement, de test et d'évaluation
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0",
    "httpx>=0.27,<1.0",        # requis par le TestClient de FastAPI
    "ragas>=0.2,<1.0",         # métriques d'évaluation du RAG
    "ruff>=0.6",               # linter et formateur
    "ipykernel>=6.29",         # pour les notebooks d'exploration
]

# Installe tous les extras d'un coup
all = ["puls-events-rag[local-embeddings,dev]"]

# --- Packaging : on indique quels dossiers sont des paquets Python
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

# =============================================================================
# Configuration des outils
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
markers = [
    "api: tests qui appellent l'API Mistral (nécessitent une clé et du réseau)",
    "slow: tests longs (construction d'index, évaluation complète)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["env", "data", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # erreurs, imports, modernisation, bugs courants